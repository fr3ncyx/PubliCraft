[package]
name = "publicraft"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "PubliCraft: desktop publishing, clone open source di Microsoft Publisher"
build = "build.rs"

[dependencies]
craft-theme = { path = "../../crates/theme" }
publicraft-doc = { path = "../../crates/doc" }
eframe.workspace = true
egui.workspace = true
rfd = "0.15"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "bmp", "gif"] }

[target.'cfg(windows)'.dependencies]
winreg = "0.55"
windows-sys = { version = "0.59", features = ["Win32_UI_Shell"] }

[build-dependencies]
winresource = "0.1"
