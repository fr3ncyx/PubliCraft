[package]
name = "publicraft"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "PubliCraft: desktop publishing, clone open source di Microsoft Publisher"
build = "build.rs"

[dependencies]
craft-theme = { path = "../../crates/theme" }
publicraft-doc = { path = "../../crates/doc" }
eframe.workspace = true
egui.workspace = true
rfd = "0.15"
flate2 = "1"
encoding_rs = "0.8"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "bmp", "gif"] }
lopdf = { version = "0.47.0", default-features = false }

[target.'cfg(windows)'.dependencies]
winreg = "0.55"
windows-sys = { version = "0.59", features = ["Win32_UI_Shell", "Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Graphics_Printing", "Win32_Storage_Xps"] }

[build-dependencies]
winresource = "0.1"
