[workspace]
resolver = "3"
members = [
    "crates/doc",
    "crates/theme",
    "apps/publicraft",
]

[workspace.package]
version = "0.2.2"
edition = "2024"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
egui = "0.37"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
